:root{--surface:#f5f0e6;--surface2:#ede6d6;--paper:#ffffff;--ink:#211f1a;--ink-soft:#5a564c;
--green:#22372d;--green2:#2c4538;--on-green:#f5f0e6;--green-soft:#9fb2a6;--brass:#b0894c;
--rule:#ddd5c4;--critical:#9a3b22;--display:Newsreader,Georgia,serif;--sans:"Schibsted Grotesk",Arial,sans-serif}
*{box-sizing:border-box;border-radius:0} html{scroll-behavior:smooth}
html,body{margin:0;background:var(--surface);color:var(--ink)}
body{font-family:var(--sans);font-size:15.5px;line-height:1.5;-webkit-font-smoothing:antialiased}
a{color:var(--green)} :focus-visible{outline:2px solid var(--green);outline-offset:2px}
.wrap{max-width:1240px;margin:0 auto;padding:0 32px}
/* Kopf mit Kurzfassung */
.hero{background:var(--green);color:var(--on-green);padding:22px 0 30px}
.htop{display:flex;align-items:center;gap:24px;flex-wrap:wrap}
.logo svg{height:24px;width:auto;display:block}
.kicker{font-size:13px;color:var(--green-soft)}
.hgrid{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,7fr);gap:40px;margin-top:22px;align-items:start}
h1{font-family:var(--display);font-weight:300;font-size:clamp(28px,3.4vw,40px);line-height:1.12;letter-spacing:-.5px;margin:0}
.lede{font-size:16px;margin:12px 0 0}
.key{border-left:1px solid rgba(245,240,230,.25);padding-left:32px}
.key h2{font-family:var(--sans);font-size:13px;font-weight:600;color:var(--green-soft);margin:0 0 8px}
.key ul{margin:0;padding-left:18px;font-size:16px;line-height:1.5} .key li{margin-bottom:6px}
/* Auf einen Blick */
.glance-w{margin-top:-1px}
.glance{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));background:var(--paper);border:1px solid var(--rule);border-top:0}
.tile{display:flex;flex-direction:column;gap:1px;padding:12px 14px 14px;text-decoration:none;color:var(--ink);border-top:4px solid var(--rule);border-right:1px solid var(--rule)}
.tile:last-child{border-right:0} .tile:hover{background:var(--surface)}
.t-g{border-top-color:var(--green-soft)} .t-y{border-top-color:var(--ink)} .t-r{border-top-color:var(--critical)}
.tb{font-size:12px;color:var(--ink-soft);font-weight:600}
.tv{font-family:var(--display);font-size:24px;line-height:1.15;margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tl{font-size:12px;color:var(--ink-soft);line-height:1.3}
.ts{font-size:12px;font-weight:600;margin-top:6px} .t-r .ts{color:var(--critical)}
.th{display:none}
/* Legende */
.klegend{font-size:12.5px;color:var(--ink-soft);margin:18px 0 14px;display:flex;flex-wrap:wrap;gap:4px 16px;align-items:center}
.dot{display:inline-block;width:10px;height:10px;flex:none;margin-right:6px;vertical-align:-1px}
.d-r{background:var(--critical)} .d-y{background:var(--ink)} .d-g{background:var(--green-soft)} .d-n{background:transparent;border:1px solid var(--ink-soft)}
/* Bereiche: Ebene 1 = Zeile, Ebene 2 = aufgeklappt */
.atools{display:flex;justify-content:space-between;align-items:baseline;margin:28px 0 10px}
.ah{font-family:var(--display);font-weight:400;font-size:24px;color:var(--green);margin:0}
.alle{font:600 14px var(--sans);color:var(--green);background:none;border:0;padding:6px 0;cursor:pointer;text-decoration:underline;text-underline-offset:3px}
.areas{background:var(--paper);border:1px solid var(--rule)}
.area{border-top:1px solid var(--rule);scroll-margin-top:12px} .area:first-child{border-top:0}
.area>summary{list-style:none;cursor:pointer;display:grid;grid-template-columns:auto minmax(0,1fr) 190px 20px;column-gap:20px;align-items:center;padding:16px 22px}
.area>summary::-webkit-details-marker{display:none}
.area>summary:hover{background:var(--surface)}
.area[open]>summary{background:var(--surface2)}
.area>summary .dot{width:12px;height:12px;margin:0}
.at{display:flex;flex-direction:column;min-width:0}
.an{font-family:var(--display);font-size:20px;line-height:1.2;color:var(--green)}
.ak{font-size:14.5px;color:var(--ink);margin-top:2px}
.aw{display:flex;flex-direction:column;text-align:right}
.av{font-family:var(--display);font-size:22px;line-height:1.15;white-space:nowrap}
.al{font-size:12px;color:var(--ink-soft);line-height:1.3}
.as{font-size:13px;font-weight:600;text-align:right} .as.s-g,.as.s-n{color:var(--ink-soft);font-weight:400}
.chev{width:10px;height:10px;border-right:2px solid var(--green);border-bottom:2px solid var(--green);transform:rotate(45deg);margin-top:-6px;justify-self:end}
.area[open] .chev{transform:rotate(225deg);margin-top:4px}
.ad{padding:4px 22px 22px 54px;border-top:1px solid var(--rule)}
.ad>.klist{display:grid;grid-template-columns:1fr 1fr;column-gap:48px}
.ad>.klist .krow:last-child{border-bottom:1px solid var(--rule)}
.ad .hl{max-width:900px}
.fgrid{display:grid;grid-template-columns:minmax(0,3fr) minmax(0,2fr);gap:40px}
.split{display:grid;grid-template-columns:1fr 1fr;gap:40px}
.klist{list-style:none;margin:0;padding:0}
.krow{display:grid;grid-template-columns:auto minmax(0,1fr) auto;column-gap:4px;align-items:start;padding:10px 0;border-bottom:1px solid var(--rule)}
.krow .dot{margin-top:5px;margin-right:8px}
.kleft{display:flex;flex-direction:column;min-width:0}
.kname{font-weight:600;font-size:15px}
.kcmp{font-size:13px;color:var(--ink-soft);line-height:1.4;margin-top:1px}
.kval{font-family:var(--display);font-size:21px;line-height:1.15;text-align:right;white-space:nowrap;padding-left:16px}
.kval.long{white-space:normal;font-family:var(--sans);font-size:14px;font-weight:600;max-width:220px}
.kflag{display:block;font-family:var(--sans);font-size:12px;font-weight:600;margin-top:2px}
.f-r{color:var(--critical)} .f-y{color:var(--ink)}
.s-r{color:var(--critical)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
h3.sub{font-size:13px;color:var(--ink-soft);font-weight:600;margin:20px 0 6px}
/* Rückmeldung */
.cbox{margin-top:22px}
.clab{display:block;font-size:13px;font-weight:600;color:var(--ink-soft);margin-bottom:6px}
.cin,.cform input{width:100%;font:15px/1.45 var(--sans);color:var(--ink);background:var(--paper);border:1px solid var(--ink-soft);padding:10px 12px}
.cin:focus,.cform input:focus{outline:2px solid var(--green);outline-offset:0;border-color:var(--green)}
.cbox .cin{max-width:900px}
.cform{margin-top:28px;background:var(--paper);border:1px solid var(--rule);padding:20px 22px 22px}
.cform .ah{margin-bottom:6px}
.chint{font-size:14px;color:var(--ink-soft);margin:0 0 16px;max-width:760px}
.crow{display:flex;gap:16px;align-items:flex-end;flex-wrap:wrap;margin-top:14px}
.cname{flex:1 1 260px;max-width:360px;margin:0} .cname input{margin-top:6px}
.csend{font:600 15px var(--sans);background:var(--green);color:var(--on-green);border:0;padding:12px 22px;cursor:pointer;min-height:44px}
.csend:hover{background:var(--green2)} .csend[disabled]{opacity:.6;cursor:wait}
.cstat{font-size:14px;margin:12px 0 0;min-height:1em} .cstat.ok{color:var(--green);font-weight:600} .cstat.err{color:var(--critical);font-weight:600}
.cbar{position:sticky;bottom:0;background:var(--green);color:var(--on-green);z-index:5}
.cbar-i{display:flex;justify-content:space-between;align-items:center;gap:16px;padding-top:10px;padding-bottom:10px}
.cbar .csend{background:var(--surface);color:var(--green)} .cbar .csend:hover{background:var(--paper)}
.cbar-t{font-size:14.5px}
/* Tabellen */
.tw{overflow-x:auto}
.dt{width:100%;border-collapse:collapse;font-size:14px}
.dt th{text-align:left;font-size:12px;color:var(--ink-soft);font-weight:600;padding:0 12px 6px 0;border-bottom:1px solid var(--ink-soft);white-space:nowrap}
.dt td{padding:8px 12px 8px 0;border-bottom:1px solid var(--rule);vertical-align:top}
.dt .r{text-align:right;white-space:nowrap} .dt .b{font-weight:600}
.dt .ti{min-width:180px} .asin{display:block;font-size:12px;color:var(--ink-soft)}
.dt tr.k-r td:last-child{color:var(--critical)}
.note{font-size:12.5px;color:var(--ink-soft);margin:6px 0 4px}
/* Gewinner und Verlierer */
.mov{display:grid;grid-template-columns:1fr 1fr;gap:28px;border-top:1px solid var(--rule);margin-top:4px}
.ml{list-style:none;margin:0;padding:0}
.ml li{display:grid;grid-template-columns:minmax(0,1fr) auto;column-gap:12px;padding:8px 0;border-bottom:1px solid var(--rule);font-size:14px}
.ml li:last-child{border-bottom:0}
.mt{font-weight:600} .mv{font-family:var(--display);font-size:19px;text-align:right} .mv.dn{color:var(--critical)}
.mc{grid-column:1/-1;font-size:12.5px;color:var(--ink-soft)}
/* Fristen */
.fl,.hl{list-style:none;margin:0;padding:0}
.fl li{display:grid;grid-template-columns:96px minmax(0,1fr) auto;column-gap:12px;padding:9px 0;border-bottom:1px solid var(--rule);font-size:14.5px}
.fd{font-weight:600} .fb{text-align:right;white-space:nowrap}
.hl li{padding:8px 0;border-bottom:1px solid var(--rule);font-size:14px} .hl li:last-child{border-bottom:0}
.gaps{margin-top:28px;font-size:14px} .gaps summary{cursor:pointer;color:var(--ink-soft);text-decoration:underline}
.gaps ul{padding-left:18px} .gaps li{margin:6px 0}
.src{font-size:12px;color:var(--ink-soft);margin-top:20px;max-width:900px}
.foot{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;border-top:1px solid var(--rule);margin-top:28px;padding-top:14px;padding-bottom:28px;font-size:12.5px;color:var(--ink-soft)}
.gate{max-width:520px;margin:18vh auto;padding:0 24px;text-align:center;color:var(--ink-soft)}
@media (max-width:1100px){ .glance{grid-template-columns:repeat(4,minmax(0,1fr))} .tile:nth-child(4n){border-right:0} .tile:nth-child(n+5){border-top-width:4px} }
@media (max-width:900px){ .ad>.klist{grid-template-columns:1fr} .split,.fgrid{grid-template-columns:1fr} .area>summary{grid-template-columns:auto minmax(0,1fr) 150px 20px} .split,.fgrid{gap:0} .hgrid{grid-template-columns:1fr;gap:20px} .key{border-left:0;padding-left:0} }
@media (max-width:640px){ .wrap{padding:0 16px} .glance{grid-template-columns:1fr 1fr} .tile:nth-child(2n){border-right:0}
  .area>summary{grid-template-columns:auto minmax(0,1fr) 20px;padding:14px 16px;column-gap:12px;align-items:start} .area>summary .dot{grid-column:1;grid-row:1;margin-top:6px} .at{grid-column:2;grid-row:1} .chev{grid-column:3;grid-row:1;margin-top:6px} .as{grid-column:2;grid-row:2;text-align:left;margin-top:6px} .ad{padding:4px 16px 18px}
  .mov{grid-template-columns:1fr;gap:0} .fl li{grid-template-columns:84px minmax(0,1fr)} .fb{grid-column:2;text-align:left} }
@media print{ .hero{-webkit-print-color-adjust:exact;print-color-adjust:exact} }
</style></head>

<script>
const MB = {"brief": "pascoe-kw44", "kunde": "Pascoe", "kw": "KW 44", "endpoint": "https://script.google.com/macros/s/AKfycbwlX2iu5CLusemQItY7DFgtpDYFSf6a2yXuuHZMNdl2LcfybTH3bffFJjXY2SEjAlxX/exec", "kontakt": "kontakt@patrickpotthoff.de"};
function wire(){
  const KEY = 'mb-entwurf-' + MB.brief;
  const fields = () => [...document.querySelectorAll('.cin')];
  const bar = document.querySelector('.cbar'), barT = document.querySelector('.cbar-t'), stat = document.querySelector('.cstat');
  try{ const d = JSON.parse(localStorage.getItem(KEY) || '{}'); fields().forEach(f => { if(d[f.dataset.bereich]) f.value = d[f.dataset.bereich]; });
       if(d._name) document.getElementById('c-name').value = d._name; }catch(e){}
  function update(){
    const n = fields().filter(f => f.value.trim()).length;
    if(bar){ bar.hidden = n === 0; barT.textContent = n === 1 ? '1 Anmerkung bereit zum Senden' : n + ' Anmerkungen bereit zum Senden'; }
    try{ const d = {}; fields().forEach(f => { if(f.value.trim()) d[f.dataset.bereich] = f.value; });
         d._name = document.getElementById('c-name').value; localStorage.setItem(KEY, JSON.stringify(d)); }catch(e){}
  }
  document.addEventListener('input', ev => { if(ev.target.matches('.cin, #c-name')) update(); });
  update();
  async function senden(btns){
    const comments = {}; let general = '';
    fields().forEach(f => { const v = f.value.trim(); if(!v) return; if(f.dataset.bereich === 'allgemein') general = v; else comments[f.dataset.bereich] = v; });
    if(!general && !Object.keys(comments).length){ stat.className = 'cstat err'; stat.textContent = 'Bitte zuerst etwas schreiben.'; document.getElementById('rueckmeldung').scrollIntoView({behavior:'smooth'}); return; }
    btns.forEach(b => b.disabled = true); stat.className = 'cstat'; stat.textContent = 'Wird gesendet …';
    const body = {brief: MB.brief, kunde: MB.kunde, kw: MB.kw, art: 'wochenstand', name: document.getElementById('c-name').value.trim(),
                  comments, general, ts: new Date().toISOString()};
    try{
      const r = await fetch(MB.endpoint, {method:'POST', headers:{'Content-Type':'text/plain;charset=utf-8'}, body: JSON.stringify(body)});
      const j = await r.json(); if(!j.ok) throw new Error(j.error || 'Fehler');
      fields().forEach(f => f.value = ''); try{ localStorage.removeItem(KEY); }catch(e){}
      update(); stat.className = 'cstat ok';
      stat.textContent = 'Danke, Ihre Rückmeldung ist bei Patrick angekommen (' + new Date().toLocaleTimeString('de-DE', {hour:'2-digit', minute:'2-digit'}) + ' Uhr).';
      document.getElementById('rueckmeldung').scrollIntoView({behavior:'smooth'});
    }catch(e){
      stat.className = 'cstat err'; stat.textContent = 'Das hat nicht geklappt. Ihr Text bleibt gespeichert; bitte später erneut senden oder an ' + MB.kontakt + ' schreiben.';
      document.getElementById('rueckmeldung').scrollIntoView({behavior:'smooth'});
    }finally{ btns.forEach(b => b.disabled = false); }
  }
  const open = id => { const el = document.getElementById(id); if(el && el.tagName==='DETAILS'){ el.open = true; } };
  document.addEventListener('click', ev => {
    const t = ev.target.closest('a.tile'); if(t){ open(t.getAttribute('href').slice(1)); }
    const sb = ev.target.closest('[data-senden]'); if(sb){ senden([...document.querySelectorAll('[data-senden]')]); return; }
    const b = ev.target.closest('[data-alle]'); if(b){
      const all = [...document.querySelectorAll('details.area')]; const auf = all.some(d=>!d.open);
      all.forEach(d=>d.open=auf); b.textContent = auf ? 'Alle zuklappen' : 'Alle aufklappen'; }
  });
}
(async function(){
  const root = document.getElementById('app');
  function fail(m){ root.innerHTML = '<div class="gate"><p>PPotthoff · Montagsbrief</p><p>'+m+'</p></div>'; }
  const key = location.hash.slice(1);
  if(!key){ fail('Dieser Montagsbrief ist nur über den persönlichen Link lesbar.'); return; }
  try{
    const b64 = s => Uint8Array.from(atob(s.replace(/-/g,'+').replace(/_/g,'/')), c=>c.charCodeAt(0));
    const raw = b64(document.getElementById('payload').textContent.trim());
    const k = await crypto.subtle.importKey('raw', b64(key), 'AES-GCM', false, ['decrypt']);
    const plain = await crypto.subtle.decrypt({name:'AES-GCM', iv: raw.slice(0,12)}, k, raw.slice(12));
    const data = JSON.parse(new TextDecoder().decode(plain));
    root.innerHTML = data.html; document.title = data.title; wire();
  }catch(e){ fail('Der Link ist unvollständig. Bitte den Link vollständig öffnen.'); }
})();
</script></body></html>
