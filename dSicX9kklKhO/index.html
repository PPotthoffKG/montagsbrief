:root{--surface:#f5f0e6;--surface2:#ede6d6;--paper:#ffffff;--ink:#211f1a;--ink-soft:#5a564c;
--green:#22372d;--green2:#2c4538;--on-green:#f5f0e6;--green-soft:#9fb2a6;--brass:#b0894c;
--rule:#ddd5c4;--critical:#9a3b22;--display:Newsreader,Georgia,serif;--sans:"Schibsted Grotesk",Arial,sans-serif}
*{box-sizing:border-box;border-radius:0}
html,body{margin:0;background:var(--paper);color:var(--ink)}
body{font-family:var(--sans);font-size:16px;line-height:1.55;-webkit-font-smoothing:antialiased}
a{color:var(--green)}
.wrap{max-width:880px;margin:0 auto;padding:0 24px}
.lbl,.kicker,h2 .n,.dk,.kl,.box h3,.sub,table.stock th{font-size:11px;letter-spacing:1.5px;text-transform:uppercase}
/* Kopf: grün, Logo quer negativ links */
.hero{background:var(--green);color:var(--on-green);padding:28px 0 36px}
.hero.slim{padding-bottom:28px}
.logo svg{height:26px;width:auto;display:block}
.kicker{color:var(--green-soft);margin-top:32px}
h1{font-family:var(--display);font-weight:300;font-size:clamp(32px,5.2vw,48px);line-height:1.08;letter-spacing:-.5px;margin:10px 0 14px}
.h1b{color:var(--green-soft)}
.lede{font-size:18px;line-height:1.6;max-width:680px;margin:0}
/* Kennzahlen auf Weiß unter dem Kopf */
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));border-bottom:1px solid var(--rule)}
.kpi{padding:20px 16px 20px 0} .kpi+.kpi{padding-left:16px;border-left:1px solid var(--rule)}
.kv{font-family:var(--display);font-weight:400;font-size:32px;line-height:1;color:var(--ink)} .kv.warn{color:var(--critical)}
.kl{color:var(--ink-soft);margin-top:8px;line-height:1.4;text-transform:none;letter-spacing:0;font-size:13px}
main section{margin-top:48px}
h2{font-family:var(--display);font-weight:400;font-size:26px;line-height:1.2;color:var(--green);margin:0 0 16px}
h2 .n,.lbl{display:block;font-family:var(--sans);color:var(--ink-soft);font-weight:600;margin-bottom:8px}
/* Auf einen Blick */
.glance{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));padding:1px 0 0 1px}
.tile{display:flex;flex-direction:column;gap:2px;background:var(--paper);padding:16px 16px 18px;text-decoration:none;color:var(--ink);border:1px solid var(--rule);border-top:4px solid var(--rule);margin:-1px 0 0 -1px}
.tile:hover{background:var(--surface)}
.t-g{border-top-color:var(--green)} .t-y{border-top-color:var(--ink-soft)} .t-r{border-top-color:var(--critical)}
.tb2{font-size:11px;letter-spacing:1.5px;text-transform:uppercase;color:var(--ink-soft);font-weight:600}
.tv{font-family:var(--display);font-size:30px;line-height:1.1;margin-top:6px}
.tl{font-size:13px;color:var(--ink-soft)}
.ts{font-size:13px;font-weight:600;margin-top:10px} .t-r .ts{color:var(--critical)} .t-g .ts{color:var(--green)}
.th{font-size:12.5px;color:var(--ink-soft);line-height:1.4}
/* Entscheidungskarte, kompakt */
.dmeta{display:flex;gap:12px;align-items:baseline} .dfr{font-size:13px;color:var(--ink-soft);margin-left:auto;white-space:nowrap}
.drec{margin:0;font-size:15px} .drec b{font-weight:600}
.dwhy{margin-top:12px;font-size:14.5px} .dwhy summary{cursor:pointer;color:var(--ink-soft);text-decoration:underline;list-style:none}
.dwhy summary::-webkit-details-marker{display:none} .dwhy p{margin:8px 0 0}
/* Alle Kennzahlen, aufklappbar */
.kzall>summary{cursor:pointer;list-style:none;font-family:var(--display);font-size:24px;color:var(--green);border-top:1px solid var(--green);padding-top:20px}
.kzall>summary::-webkit-details-marker{display:none}
.kzall>summary::after{content:" +";color:var(--ink-soft)} .kzall[open]>summary::after{content:" −"}
.kzall>summary .n{display:block;font-family:var(--sans);font-size:11px;letter-spacing:1.5px;text-transform:uppercase;color:var(--ink-soft);font-weight:600;margin-bottom:6px}
.kzh{font-size:11px;letter-spacing:1.5px;text-transform:uppercase;color:var(--ink-soft);font-weight:600;margin:24px 0 4px}
.kv2{display:block}
/* Fortschrittsleiste */
.bar{position:sticky;bottom:0;background:var(--green);color:var(--on-green);margin-top:32px}
.barin{display:flex;justify-content:space-between;align-items:center;padding-top:10px;padding-bottom:10px;font-size:14px;font-weight:600}
.bar .primary{background:var(--paper);color:var(--green);text-decoration:none;min-height:40px;display:inline-flex;align-items:center}
/* Kennzahlen mit Ampel */
.kzt{width:100%;border-collapse:collapse;font-size:14.5px}
.kzt th{text-align:left;font-size:11px;letter-spacing:1.5px;text-transform:uppercase;color:var(--ink-soft);font-weight:600;padding:0 10px 8px 0;border-bottom:1px solid var(--ink-soft)}
.kzt td{padding:9px 10px 9px 0;border-bottom:1px solid var(--rule);vertical-align:top}
.kzt tr.grp td{border-top:1px solid var(--ink-soft)} .kzt tbody tr:first-child td{border-top:0}
.kb{color:var(--ink-soft);font-size:12.5px;white-space:nowrap} .kn{font-weight:600}
.kz{display:block;font-weight:400;font-size:12.5px;color:var(--ink-soft)}
.kw{font-variant-numeric:tabular-nums;white-space:nowrap} .kv2{color:var(--ink-soft);font-size:13px}
.ka{white-space:nowrap;font-size:13px}
.am{display:inline-block;width:10px;height:10px;margin-right:6px;vertical-align:0}
.a-g{background:var(--green)} .a-y{border:2px solid var(--ink-soft)} .a-r{background:var(--critical)} .a-n{display:none}
/* Entscheidungskarte */
.dec{display:flex;gap:16px;background:var(--surface);padding:20px 22px;margin-bottom:12px;border-left:4px solid var(--rule);transition:border-color .15s linear}
.dec.ja{border-left-color:var(--green)} .dec.nein{border-left-color:var(--critical)}
.dn{font-family:var(--display);font-size:32px;color:var(--ink);line-height:1;width:24px;flex:none} .dn.first{color:var(--brass)}
.db{flex:1;min-width:0}
.dk{color:var(--ink-soft);font-weight:600}
.dq{font-size:18px;font-weight:600;margin:4px 0 8px;line-height:1.35}
.dr{margin:0;font-size:15.5px} .dr b{font-weight:600}
.dalt{margin:6px 0 0;font-size:14px;color:var(--ink-soft)}
.vote{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px}
.vb{font:inherit;font-size:14px;font-weight:600;padding:10px 22px;min-height:44px;cursor:pointer;border:1.5px solid var(--green);background:var(--paper);color:var(--green)}
.vb.no{border-color:var(--ink-soft);color:var(--ink)}
.vb.yes[aria-pressed=true]{background:var(--green);color:var(--on-green)}
.vb.no[aria-pressed=true]{background:var(--critical);border-color:var(--critical);color:var(--paper)}
.cbtn{font:inherit;font-size:14px;border:0;background:transparent;color:var(--ink-soft);text-decoration:underline;padding:10px;cursor:pointer;min-height:44px}
textarea,input[type=text]{font:inherit;font-size:15px;width:100%;border:1px solid var(--ink-soft);padding:10px 12px;background:var(--paper);color:var(--ink)}
:focus-visible{outline:2px solid var(--green);outline-offset:2px}
.dcom{margin-top:10px}
.todo{display:flex;gap:12px;align-items:flex-start;padding:12px 0;border-bottom:1px solid var(--rule);cursor:pointer;font-size:15.5px}
.todo input,.task input{width:22px;height:22px;accent-color:var(--green);flex:none;margin-top:2px}
.todo input:checked+span{color:var(--ink-soft);text-decoration:line-through}
.send{border:1px solid var(--green);padding:24px}
.sendrow{display:flex;gap:10px;margin-top:10px} .sendrow input{flex:1}
.primary{font:inherit;font-weight:600;font-size:14px;background:var(--green);color:var(--on-green);border:0;padding:12px 22px;cursor:pointer;white-space:nowrap;min-height:44px}
.primary:hover{background:var(--green2)} .primary:disabled{opacity:.6;cursor:default}
.status{margin:10px 0 0;font-size:14px;color:var(--ink-soft);min-height:1.2em} .status.ok{color:var(--green);font-weight:600} .status.err{color:var(--critical)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:32px;border-top:1px solid var(--rule);padding-top:24px}
.box h3{color:var(--ink-soft);font-weight:600;margin:0 0 8px}
.box ul{margin:0;padding-left:18px;font-size:15px} .box li{margin-bottom:4px}
/* Zahlenteil */
.numbers{border-top:1px solid var(--green);padding-top:24px}
h2.big{font-size:32px}
.grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:40px 36px;margin-top:24px}
.card.wide{grid-column:1/-1}
.card h3{font-family:var(--display);font-weight:400;font-size:20px;margin:0 0 4px;line-height:1.25}
.card .sub{color:var(--ink-soft);margin-bottom:12px;letter-spacing:.5px;text-transform:none;font-size:12.5px}
.card svg{width:100%;height:auto;display:block}
.take{font-size:14px;margin:12px 0 0;border-top:1px solid var(--rule);padding-top:8px} .take b{font-weight:600;color:var(--green)}
svg text{font-family:var(--sans)}
.ax{font-size:7.5px;fill:var(--ink-soft)} .lab{font-size:8px;fill:var(--ink);font-weight:600}
.rl,.rv{font-size:8.5px;fill:var(--ink)} .rl.strong,.rv.strong{font-weight:600}
table.stock{width:100%;border-collapse:collapse;font-size:14px}
table.stock th{text-align:left;color:var(--ink-soft);font-weight:600;padding:0 8px 6px 0;border-bottom:1px solid var(--ink-soft)}
table.stock td{padding:8px 8px 8px 0;border-bottom:1px solid var(--rule);vertical-align:top}
table.stock .num{text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums} table.stock .st{color:var(--critical);font-weight:600}
.legend{display:flex;flex-wrap:wrap;gap:14px;font-size:12px;color:var(--ink-soft);margin-top:6px}
.sw{display:inline-block;width:10px;height:10px;margin-right:5px;vertical-align:-1px} .sw.dash{border:1px dashed var(--green)}
.src{font-size:12px;color:var(--ink-soft);margin-top:28px}
.foot{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;border-top:1px solid var(--rule);margin-top:48px;padding-top:16px;padding-bottom:32px;font-size:12.5px;color:var(--ink-soft)}
/* Arbeitsliste */
.task{display:flex;gap:12px;align-items:flex-start;padding:16px 0;border-bottom:1px solid var(--rule);cursor:pointer}
.tn{font-family:var(--display);font-size:22px;width:20px;flex:none;line-height:1.1}
.tb{display:flex;flex-direction:column;gap:3px;min-width:0;flex:1}
.tmeta{display:flex;flex-wrap:wrap;gap:6px 12px;align-items:baseline;font-size:13px;color:var(--ink-soft)}
.prio{font-size:11px;letter-spacing:1.5px;text-transform:uppercase;font-weight:600;padding:1px 6px;border:1px solid currentColor}
.p-hoch{color:var(--critical)} .p-mittel{color:var(--ink)} .p-normal{color:var(--ink-soft)}
.tart{font-weight:600;color:var(--ink)} .asin{font-weight:400;color:var(--ink-soft);margin-left:6px} .tfr{margin-left:auto;white-space:nowrap}
.ttx{font-size:16px;font-weight:600;line-height:1.35} .twy{font-size:14px;color:var(--ink-soft)}
.task input:checked~.tb .ttx{text-decoration:line-through;color:var(--ink-soft)}
.wait ul{list-style:none;margin:0;padding:0} .wait li{display:flex;justify-content:space-between;gap:16px;padding:10px 0;border-bottom:1px dashed var(--rule);font-size:15px}
.wdep{color:var(--ink-soft);font-size:13px;white-space:nowrap}
/* Bild und Erzählung */
.bignum{font-family:var(--display);font-weight:300;font-size:clamp(64px,12vw,112px);line-height:.95;margin-top:16px}
.bigsub{font-size:19px;margin:8px 0 0;max-width:560px}
.herochart svg{width:100%;height:auto;display:block}
.dec.vis{display:block;background:var(--paper);border:1px solid var(--rule);border-left:4px solid var(--rule);padding:20px 22px;margin-bottom:24px}
.vtop{display:flex;align-items:baseline;gap:10px} .vtop .dn{width:auto;font-size:28px}
.vq{font-family:var(--display);font-weight:400;font-size:24px;line-height:1.2;margin:6px 0 14px;color:var(--green)}
.vchart svg{width:100%;height:auto;display:block} .vline{font-size:16px;margin:14px 0 0}
.narrow{max-width:700px}
.erztext{font-family:var(--display);font-size:19px;line-height:1.6}
.erztext>p{margin:0 0 18px} .erztext .anrede{margin-top:36px} .erztext .eh{font-size:22px;margin:32px 0 10px}
.dec.inl{display:block;font-family:var(--sans);font-size:15.5px;line-height:1.5;margin:4px 0 24px}
.erztext .todos,.erztext .send,.erztext .src{font-family:var(--sans);font-size:15.5px}
.gate{max-width:520px;margin:18vh auto;padding:0 24px;text-align:center;color:var(--ink-soft)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
@media (max-width:700px){
  .kpis{grid-template-columns:1fr 1fr} .kpi:nth-child(3){border-left:0;padding-left:0}
  .kpi:nth-child(n+3){border-top:1px solid var(--rule)}
  .grid,.two{grid-template-columns:minmax(0,1fr)} .sendrow{flex-direction:column} .dec{padding:16px}
  .tfr{margin-left:0} .wait li{flex-direction:column;gap:2px} .kicker{margin-top:24px}
  .kzt tr{display:grid;grid-template-columns:1fr auto;grid-template-areas:"n a" "w w";column-gap:12px;border-bottom:1px solid var(--rule);padding:8px 0}
  .kzt td{border:0;padding:2px 0} .kn{grid-area:n} .kw{grid-area:w} .ka{grid-area:a;text-align:right}
  .glance{grid-template-columns:1fr 1fr} .tv{font-size:26px}
  .dmeta{flex-wrap:wrap} .dfr{margin-left:0}
}
@media print{ .vote,.send,.cbtn{display:none} .hero{-webkit-print-color-adjust:exact;print-color-adjust:exact} }
</style></head>

<script>
(async function(){
  const root = document.getElementById('app');
  const ENDPOINT = "https://script.google.com/macros/s/AKfycbwlX2iu5CLusemQItY7DFgtpDYFSf6a2yXuuHZMNdl2LcfybTH3bffFJjXY2SEjAlxX/exec";
  function fail(msg){ root.innerHTML = '<div class="gate"><p>PPotthoff · Montagsbrief</p><p>'+msg+'</p></div>'; }
  const key = location.hash.slice(1);
  if(!key){ fail('Dieser Montagsbrief ist nur über den persönlichen Link lesbar.'); return; }
  let data;
  try{
    const b64 = s => Uint8Array.from(atob(s.replace(/-/g,'+').replace(/_/g,'/')), c=>c.charCodeAt(0));
    const raw = b64(document.getElementById('payload').textContent.trim());
    const k = await crypto.subtle.importKey('raw', b64(key), 'AES-GCM', false, ['decrypt']);
    const plain = await crypto.subtle.decrypt({name:'AES-GCM', iv: raw.slice(0,12)}, k, raw.slice(12));
    data = JSON.parse(new TextDecoder().decode(plain));
  }catch(e){ fail('Der Link ist unvollständig. Bitte den Link aus der E-Mail vollständig öffnen.'); return; }
  root.innerHTML = data.html;
  document.title = 'Montagsbrief ' + data.brief.kw + ' · ' + data.brief.kunde;
  const B = data.brief, state = {decisions:{}, comments:{}, todos:{}};
  const store = { get(){ try{ return JSON.parse(localStorage.getItem('mb-'+B.id)||'null'); }catch(e){ return null; } },
                  set(v){ try{ localStorage.setItem('mb-'+B.id, JSON.stringify(v)); }catch(e){} } };
  function apply(s){
    if(!s) return;
    Object.assign(state.decisions, s.decisions||{}); Object.assign(state.comments, s.comments||{}); Object.assign(state.todos, s.todos||{});
    document.querySelectorAll('.dec').forEach(card=>{
      const n = card.dataset.n, v = state.decisions[n];
      card.classList.toggle('ja', v==='ja'); card.classList.toggle('nein', v==='nein');
      card.querySelectorAll('.vb').forEach(b=>b.setAttribute('aria-pressed', String(b.dataset.v===v)));
      const ta = card.querySelector('.dcom'); if(state.comments[n]){ ta.value = state.comments[n]; ta.hidden = false; }
    });
    document.querySelectorAll('[data-t]').forEach(cb=>{ cb.checked = !!state.todos[cb.dataset.t]; });
    const prog = document.getElementById('prog');
    if(prog){ const t = document.querySelectorAll('.dec').length, d = Object.values(state.decisions).filter(Boolean).length;
      prog.textContent = d + ' von ' + t + ' entschieden'; }
    if(s.general) document.getElementById('gcom').value = s.general;
    if(s.name) document.getElementById('who').value = s.name;
  }
  const status = document.getElementById('status');
  function setStatus(t, cls){ status.textContent = t; status.className = 'status ' + (cls||''); }
  document.querySelectorAll('.dec').forEach(card=>{
    const n = card.dataset.n;
    card.querySelectorAll('.vb').forEach(b=>b.addEventListener('click', ()=>{
      state.decisions[n] = (state.decisions[n]===b.dataset.v) ? undefined : b.dataset.v; apply({}); setStatus('Noch nicht gesendet.');
      if(b.dataset.v==='nein' && state.decisions[n]==='nein'){ const ta=card.querySelector('.dcom'); ta.hidden=false; ta.focus(); }
    }));
    const cb = card.querySelector('.cbtn'), ta = card.querySelector('.dcom');
    cb.addEventListener('click', ()=>{ ta.hidden = !ta.hidden; cb.setAttribute('aria-expanded', String(!ta.hidden)); if(!ta.hidden) ta.focus(); });
    ta.addEventListener('input', ()=>{ state.comments[n] = ta.value; });
  });
  document.querySelectorAll('[data-t]').forEach(cb=>cb.addEventListener('change', ()=>{ state.todos[cb.dataset.t] = cb.checked; setStatus('Noch nicht gesendet.'); }));
  const local = store.get(); apply(local);
  if(ENDPOINT){
    try{
      const r = await fetch(ENDPOINT + '?brief=' + encodeURIComponent(B.id));
      const j = await r.json();
      if(j && j.latest){ apply(j.latest); setStatus('Zuletzt gesendet: ' + new Date(j.latest.ts).toLocaleString('de-DE', {dateStyle:'medium', timeStyle:'short'}) + (j.latest.name ? ' von ' + j.latest.name : ''), 'ok'); }
    }catch(e){}
  } else if(local && local.ts){ setStatus('Vorschau: zuletzt lokal gespeichert ' + new Date(local.ts).toLocaleString('de-DE'), ''); }
  document.getElementById('submit').addEventListener('click', async ()=>{
    const btn = document.getElementById('submit');
    const total = document.querySelectorAll('.dec').length;
    const decided = Object.values(state.decisions).filter(Boolean).length;
    const answer = { brief: B.id, kunde: B.kunde, kw: B.kw, name: document.getElementById('who').value.trim(),
      decisions: state.decisions, comments: state.comments, todos: state.todos,
      general: document.getElementById('gcom').value.trim(), ts: new Date().toISOString() };
    btn.disabled = true; setStatus('Wird gesendet …');
    try{
      if(!ENDPOINT){ await new Promise(r=>setTimeout(r,300)); store.set(answer);
        setStatus('Vorschau: Antwort nur lokal gespeichert (' + decided + ' von ' + total + ' Entscheidungen).', 'ok'); }
      else {
        const r = await fetch(ENDPOINT, {method:'POST', headers:{'Content-Type':'text/plain;charset=utf-8'}, body: JSON.stringify(answer)});
        const j = await r.json(); if(!j.ok) throw new Error(j.error||'Fehler');
        store.set(answer); setStatus('Danke, ist angekommen.' + (total ? ' ' + decided + ' von ' + total + ' Entscheidungen beantwortet.' : ''), 'ok');
      }
    }catch(e){ setStatus('Senden hat nicht geklappt. Bitte noch einmal versuchen oder kurz per E-Mail antworten.', 'err'); }
    btn.disabled = false;
  });
})();
</script></body></html>
