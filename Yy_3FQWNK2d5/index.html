:root{--g:#22372d;--b:#b0894c;--c:#f5f0e6;--ink:#1f1d18;--mu:#6b665b;--ru:#ddd5c4;}
*{box-sizing:border-box} html,body{margin:0;background:#fff;color:var(--ink)}
body{font-family:Schibsted,Arial,sans-serif;font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased}
.wrap{max-width:860px;margin:0 auto;padding:0 20px}
.hero{background:var(--g);color:#f5f0e6;padding:44px 0 30px}
.kicker{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--b);font-weight:600}
h1{font-family:Newsreader,Georgia,serif;font-weight:400;font-size:clamp(32px,5vw,46px);line-height:1.08;margin:12px 0 12px;letter-spacing:-.01em}
h1 em{color:var(--b)}
.lede{font-size:17px;color:#e9e2d2;max-width:640px;margin:0}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));margin-top:28px;border-top:1px solid rgba(245,240,230,.22)}
.kpi{padding:16px 14px 0 0} .kpi+.kpi{padding-left:14px;border-left:1px solid rgba(245,240,230,.22)}
.kv{font-family:Newsreader,Georgia,serif;font-size:34px;line-height:1;color:#fff} .kv.warn{color:var(--b)}
.kl{font-size:13px;color:#cfc7b4;margin-top:6px;line-height:1.35}
main section{margin-top:38px}
h2{font-family:Newsreader,Georgia,serif;font-weight:400;font-size:24px;color:var(--g);margin:0 0 14px;line-height:1.2}
h2 .n{display:block;font-family:Schibsted,Arial,sans-serif;font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--b);font-weight:600;margin-bottom:4px}
.dec{display:flex;gap:16px;background:var(--c);border-radius:4px;padding:18px 20px;margin-bottom:12px;border-left:4px solid transparent;transition:border-color .2s}
.dec.ja{border-left-color:var(--g)} .dec.nein{border-left-color:#9a3b22}
.dn{font-family:Newsreader,Georgia,serif;font-size:32px;color:var(--b);line-height:1;width:24px;flex:none}
.db{flex:1;min-width:0}
.dk{font-size:12px;text-transform:uppercase;letter-spacing:.12em;color:var(--mu);font-weight:600}
.dq{font-size:18px;font-weight:600;margin:4px 0 8px;line-height:1.35}
.dr{margin:0;font-size:15.5px} .dalt{margin:6px 0 0;font-size:14px;color:var(--mu)}
.rec{display:inline-block;background:var(--g);color:#fff;font-size:12px;font-weight:600;padding:2px 9px;border-radius:12px;margin-right:6px;vertical-align:1px}
.vote{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.vb,.cbtn{font:inherit;font-size:15px;font-weight:600;border-radius:22px;padding:8px 22px;cursor:pointer;border:1.5px solid var(--g);background:#fff;color:var(--g);min-height:44px}
.vb.no{border-color:#b9b2a3;color:var(--ink)}
.vb.yes[aria-pressed=true]{background:var(--g);color:#fff}
.vb.no[aria-pressed=true]{background:#9a3b22;border-color:#9a3b22;color:#fff}
.cbtn{border-color:transparent;background:transparent;color:var(--mu);font-weight:500;text-decoration:underline;padding:8px 10px}
textarea,input[type=text]{font:inherit;font-size:15px;width:100%;border:1.5px solid var(--ru);border-radius:4px;padding:10px 12px;background:#fff;color:var(--ink)}
textarea:focus,input:focus,button:focus-visible{outline:2px solid var(--b);outline-offset:2px}
.dcom{margin-top:10px}
.todo{display:flex;gap:12px;align-items:flex-start;padding:12px 0;border-bottom:1px solid var(--ru);cursor:pointer;font-size:15.5px}
.todo input{width:22px;height:22px;accent-color:var(--g);flex:none;margin-top:1px}
.todo input:checked+span{color:var(--mu);text-decoration:line-through}
.send{border:1.5px solid var(--g);border-radius:4px;padding:20px}
.sendrow{display:flex;gap:10px;margin-top:10px} .sendrow input{flex:1}
.primary{font:inherit;font-weight:600;font-size:16px;background:var(--g);color:#fff;border:0;border-radius:4px;padding:12px 22px;cursor:pointer;white-space:nowrap}
.primary:disabled{opacity:.6;cursor:default}
.status{margin:10px 0 0;font-size:14px;color:var(--mu);min-height:1.2em} .status.ok{color:var(--g);font-weight:600} .status.err{color:#9a3b22}
.two{display:grid;grid-template-columns:1fr 1fr;gap:28px}
.box h3{font-size:12px;text-transform:uppercase;letter-spacing:.12em;margin:0 0 8px;color:var(--g);font-weight:600}
.box ul{margin:0;padding-left:18px;font-size:15px} .box li{margin-bottom:4px}
.numbers{border-top:2px solid var(--g);padding-top:26px}
.kicker.dark{margin-bottom:4px} h2.big{font-size:30px}
.grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:34px 36px;margin-top:22px}
.card h3{font-family:Newsreader,Georgia,serif;font-weight:400;font-size:19px;margin:0 0 4px;line-height:1.25}
.card .sub{font-size:12.5px;color:var(--mu);margin-bottom:10px}
.card svg{width:100%;height:auto;display:block} table.stock svg{width:auto}
.take{font-size:14px;margin-top:10px;border-left:2px solid var(--b);padding-left:10px}
svg text{font-family:Schibsted,Arial,sans-serif}
.ax{font-size:7px;fill:var(--mu)} .lab{font-size:7.5px;fill:var(--ink);font-weight:600}
.rl,.rv{font-size:8px;fill:var(--ink)} .rl.strong,.rv.strong{font-weight:600}
table.stock{width:100%;border-collapse:collapse;font-size:13.5px}
table.stock th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.1em;color:var(--mu);font-weight:600;padding:0 8px 6px 0;border-bottom:1px solid var(--ru)}
table.stock td{padding:7px 8px 7px 0;border-bottom:1px solid var(--ru);vertical-align:middle}
table.stock .num{color:var(--mu);white-space:nowrap} table.stock .st{color:#9a3b22;font-weight:600;font-size:12.5px}
.legend{display:flex;flex-wrap:wrap;gap:14px;font-size:12px;color:var(--mu);margin-top:6px}
.sw{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px} .sw.dash{border:1px dashed var(--g)}
.src{font-size:12px;color:var(--mu);margin-top:26px}
.foot{display:flex;justify-content:space-between;border-top:1px solid var(--ru);margin-top:36px;padding:14px 20px 28px;font-size:12.5px;color:var(--mu)}
.brand{font-family:Newsreader,Georgia,serif;font-size:17px;color:var(--g)} .brand b{color:var(--b);font-weight:400}
.gate{max-width:520px;margin:18vh auto;padding:0 20px;text-align:center;color:var(--mu)}
@media (max-width:700px){ .kpis{grid-template-columns:1fr 1fr} .kpi:nth-child(3){border-left:0;padding-left:0} .kpi{padding-bottom:14px}
  .grid,.two{grid-template-columns:minmax(0,1fr)} table.stock td:nth-child(3),table.stock th:nth-child(3){display:none} .sendrow{flex-direction:column} .dec{padding:16px} }
</style></head>

<script>
(async function(){
  const root = document.getElementById('app');
  const ENDPOINT = "https://script.google.com/macros/s/AKfycbwlX2iu5CLusemQItY7DFgtpDYFSf6a2yXuuHZMNdl2LcfybTH3bffFJjXY2SEjAlxX/exec";
  function fail(msg){ root.innerHTML = '<div class="gate"><p class="brand">P<b>P</b>otthoff</p><p>'+msg+'</p></div>'; }
  const key = location.hash.slice(1);
  if(!key){ fail('Dieser Montagsbrief ist nur über den persönlichen Link lesbar.'); return; }
  let data;
  try{
    const b64 = s => Uint8Array.from(atob(s.replace(/-/g,'+').replace(/_/g,'/')), c=>c.charCodeAt(0));
    const raw = b64(document.getElementById('payload').textContent.trim());
    const k = await crypto.subtle.importKey('raw', b64(key), 'AES-GCM', false, ['decrypt']);
    const plain = await crypto.subtle.decrypt({name:'AES-GCM', iv: raw.slice(0,12)}, k, raw.slice(12));
    data = JSON.parse(new TextDecoder().decode(plain));
  }catch(e){ fail('Der Link ist unvollständig. Bitte den Link aus der E-Mail vollständig öffnen.'); return; }
  root.innerHTML = data.html;
  document.title = 'Montagsbrief ' + data.brief.kw + ' · ' + data.brief.kunde;
  const B = data.brief, state = {decisions:{}, comments:{}, todos:{}};
  const store = { get(){ try{ return JSON.parse(localStorage.getItem('mb-'+B.id)||'null'); }catch(e){ return null; } },
                  set(v){ try{ localStorage.setItem('mb-'+B.id, JSON.stringify(v)); }catch(e){} } };

  function apply(s){
    if(!s) return;
    Object.assign(state.decisions, s.decisions||{}); Object.assign(state.comments, s.comments||{}); Object.assign(state.todos, s.todos||{});
    document.querySelectorAll('.dec').forEach(card=>{
      const n = card.dataset.n, v = state.decisions[n];
      card.classList.toggle('ja', v==='ja'); card.classList.toggle('nein', v==='nein');
      card.querySelectorAll('.vb').forEach(b=>b.setAttribute('aria-pressed', String(b.dataset.v===v)));
      const ta = card.querySelector('.dcom'); if(state.comments[n]){ ta.value = state.comments[n]; ta.hidden = false; }
    });
    document.querySelectorAll('[data-t]').forEach(cb=>{ cb.checked = !!state.todos[cb.dataset.t]; });
    if(s.general) document.getElementById('gcom').value = s.general;
    if(s.name) document.getElementById('who').value = s.name;
  }
  const status = document.getElementById('status');
  function setStatus(t, cls){ status.textContent = t; status.className = 'status ' + (cls||''); }

  document.querySelectorAll('.dec').forEach(card=>{
    const n = card.dataset.n;
    card.querySelectorAll('.vb').forEach(b=>b.addEventListener('click', ()=>{
      state.decisions[n] = (state.decisions[n]===b.dataset.v) ? undefined : b.dataset.v; apply({}); setStatus('Noch nicht gesendet.');
      if(b.dataset.v==='nein' && state.decisions[n]==='nein'){ const ta=card.querySelector('.dcom'); ta.hidden=false; ta.focus(); }
    }));
    const cb = card.querySelector('.cbtn'), ta = card.querySelector('.dcom');
    cb.addEventListener('click', ()=>{ ta.hidden = !ta.hidden; cb.setAttribute('aria-expanded', String(!ta.hidden)); if(!ta.hidden) ta.focus(); });
    ta.addEventListener('input', ()=>{ state.comments[n] = ta.value; });
  });
  document.querySelectorAll('[data-t]').forEach(cb=>cb.addEventListener('change', ()=>{ state.todos[cb.dataset.t] = cb.checked; setStatus('Noch nicht gesendet.'); }));

  const local = store.get(); apply(local);
  if(ENDPOINT){
    try{
      const r = await fetch(ENDPOINT + '?brief=' + encodeURIComponent(B.id));
      const j = await r.json();
      if(j && j.latest){ apply(j.latest); setStatus('Zuletzt gesendet: ' + new Date(j.latest.ts).toLocaleString('de-DE', {dateStyle:'medium', timeStyle:'short'}) + (j.latest.name ? ' von ' + j.latest.name : ''), 'ok'); }
    }catch(e){}
  } else if(local && local.ts){ setStatus('Vorschau: zuletzt lokal gespeichert ' + new Date(local.ts).toLocaleString('de-DE'), ''); }

  document.getElementById('submit').addEventListener('click', async ()=>{
    const btn = document.getElementById('submit');
    const decided = Object.values(state.decisions).filter(Boolean).length;
    const answer = { brief: B.id, kunde: B.kunde, kw: B.kw, name: document.getElementById('who').value.trim(),
      decisions: state.decisions, comments: state.comments, todos: state.todos,
      general: document.getElementById('gcom').value.trim(), ts: new Date().toISOString() };
    btn.disabled = true; setStatus('Wird gesendet …');
    try{
      if(!ENDPOINT){ await new Promise(r=>setTimeout(r,400)); store.set(answer);
        setStatus('Vorschau: Antwort lokal gespeichert (' + decided + ' von ' + document.querySelectorAll('.dec').length + ' Entscheidungen). Im Live-Betrieb landet sie in der Antwort-Tabelle.', 'ok'); }
      else {
        const r = await fetch(ENDPOINT, {method:'POST', headers:{'Content-Type':'text/plain;charset=utf-8'}, body: JSON.stringify(answer)});
        const j = await r.json(); if(!j.ok) throw new Error(j.error||'Fehler');
        store.set(answer); setStatus('Danke, ist angekommen. ' + decided + ' von ' + document.querySelectorAll('.dec').length + ' Entscheidungen beantwortet.', 'ok');
      }
    }catch(e){ setStatus('Senden hat nicht geklappt. Bitte noch einmal versuchen oder kurz per E-Mail antworten.', 'err'); }
    btn.disabled = false;
  });
})();
</script></body></html>
