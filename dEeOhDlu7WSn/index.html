:root{--surface:#f5f0e6;--surface2:#ede6d6;--paper:#ffffff;--ink:#211f1a;--ink-soft:#5a564c;
--green:#22372d;--green2:#2c4538;--on-green:#f5f0e6;--green-soft:#9fb2a6;--brass:#b0894c;
--rule:#ddd5c4;--critical:#9a3b22;--display:Newsreader,Georgia,serif;--sans:"Schibsted Grotesk",Arial,sans-serif}
*{box-sizing:border-box;border-radius:0} html{scroll-behavior:smooth}
html,body{margin:0;background:var(--surface);color:var(--ink)}
body{font-family:var(--sans);font-size:15.5px;line-height:1.5;-webkit-font-smoothing:antialiased}
a{color:var(--green)} :focus-visible{outline:2px solid var(--green);outline-offset:2px}
.wrap{max-width:1240px;margin:0 auto;padding:0 32px}
/* Kopf mit Kurzfassung */
.hero{background:var(--green);color:var(--on-green);padding:22px 0 30px}
.htop{display:flex;align-items:center;gap:24px;flex-wrap:wrap}
.logo svg{height:24px;width:auto;display:block}
.kicker{font-size:13px;color:var(--green-soft)}
.hgrid{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,7fr);gap:40px;margin-top:22px;align-items:start}
h1{font-family:var(--display);font-weight:300;font-size:clamp(28px,3.4vw,40px);line-height:1.12;letter-spacing:-.5px;margin:0}
.lede{font-size:16px;margin:12px 0 0}
.key{border-left:1px solid rgba(245,240,230,.25);padding-left:32px}
.key h2{font-family:var(--sans);font-size:13px;font-weight:600;color:var(--green-soft);margin:0 0 8px}
.key ul{margin:0;padding-left:18px;font-size:16px;line-height:1.5} .key li{margin-bottom:6px}
/* Auf einen Blick */
.glance-w{margin-top:-1px}
.glance{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));background:var(--paper);border:1px solid var(--rule);border-top:0}
.tile{display:flex;flex-direction:column;gap:1px;padding:12px 14px 14px;text-decoration:none;color:var(--ink);border-top:4px solid var(--rule);border-right:1px solid var(--rule)}
.tile:last-child{border-right:0} .tile:hover{background:var(--surface)}
.t-g{border-top-color:var(--green-soft)} .t-y{border-top-color:var(--ink)} .t-r{border-top-color:var(--critical)}
.tb{font-size:12px;color:var(--ink-soft);font-weight:600}
.tv{font-family:var(--display);font-size:24px;line-height:1.15;margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tl{font-size:12px;color:var(--ink-soft);line-height:1.3}
.ts{font-size:12px;font-weight:600;margin-top:6px} .t-r .ts{color:var(--critical)}
.th{display:none}
/* Legende */
.klegend{font-size:12.5px;color:var(--ink-soft);margin:18px 0 14px;display:flex;flex-wrap:wrap;gap:4px 16px;align-items:center}
.dot{display:inline-block;width:10px;height:10px;flex:none;margin-right:6px;vertical-align:-1px}
.d-r{background:var(--critical)} .d-y{background:var(--ink)} .d-g{background:var(--green-soft)} .d-n{background:transparent;border:1px solid var(--ink-soft)}
/* Felder */
.panels{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px;align-items:stretch}
.split{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:40px}
.wide .pb>.klist{display:grid;grid-template-columns:1fr 1fr;column-gap:48px} .wide .pb>.klist .krow:last-child{border-bottom:1px solid var(--rule)}
.side .mov{grid-template-columns:1fr;gap:0;border-top:0;margin-top:0} .side h3.sub:first-child{margin-top:8px}
.fgrid{display:grid;grid-template-columns:minmax(0,3fr) minmax(0,2fr);gap:40px}
.panel{background:var(--paper);border:1px solid var(--rule);border-top:4px solid var(--rule);scroll-margin-top:12px}
.panel.wide{grid-column:1/-1}
.p-r{border-top-color:var(--critical)} .p-y{border-top-color:var(--ink)} .p-g{border-top-color:var(--green-soft)}
.ph{display:flex;justify-content:space-between;align-items:baseline;gap:16px;padding:16px 22px 0}
.ph h2{font-family:var(--display);font-weight:400;font-size:22px;line-height:1.2;color:var(--green);margin:0}
.pst{font-size:13px;font-weight:600;white-space:nowrap} .s-r{color:var(--critical)} .s-g,.s-n{color:var(--ink-soft);font-weight:400}
.kurz{font-size:15px;margin:6px 22px 4px;color:var(--ink)}
.pb{padding:0 22px 8px}
.klist{list-style:none;margin:0;padding:0}
.krow{display:grid;grid-template-columns:auto minmax(0,1fr) auto;column-gap:4px;align-items:start;padding:10px 0;border-bottom:1px solid var(--rule)}
.krow:last-child{border-bottom:0}
.krow .dot{margin-top:5px;margin-right:8px}
.kleft{display:flex;flex-direction:column;min-width:0}
.kname{font-weight:600;font-size:15px}
.kcmp{font-size:13px;color:var(--ink-soft);line-height:1.4;margin-top:1px}
.kval{font-family:var(--display);font-size:21px;line-height:1.15;text-align:right;white-space:nowrap;padding-left:16px}
.kval.long{white-space:normal;font-family:var(--sans);font-size:14px;font-weight:600;max-width:240px}
.kflag{display:block;font-family:var(--sans);font-size:12px;font-weight:600;margin-top:2px}
.f-r{color:var(--critical)} .f-y{color:var(--ink)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
h3.sub{font-size:13px;color:var(--ink-soft);font-weight:600;margin:20px 0 6px}
.more{border-top:1px solid var(--rule)}
.more>summary{cursor:pointer;list-style:none;font-size:14px;font-weight:600;color:var(--green);padding:11px 0}
.more>summary::-webkit-details-marker{display:none}
.more>summary::before{content:"+ "} .more[open]>summary::before{content:"− "}
.more[open]>summary{border-bottom:1px solid var(--rule)}
/* Tabellen */
.tw{overflow-x:auto}
.dt{width:100%;border-collapse:collapse;font-size:14px}
.dt th{text-align:left;font-size:12px;color:var(--ink-soft);font-weight:600;padding:0 12px 6px 0;border-bottom:1px solid var(--ink-soft);white-space:nowrap}
.dt td{padding:8px 12px 8px 0;border-bottom:1px solid var(--rule);vertical-align:top}
.dt .r{text-align:right;white-space:nowrap} .dt .b{font-weight:600}
.dt .ti{min-width:180px} .asin{display:block;font-size:12px;color:var(--ink-soft)}
.dt tr.k-r td:last-child{color:var(--critical)}
.note{font-size:12.5px;color:var(--ink-soft);margin:6px 0 4px}
/* Gewinner und Verlierer */
.mov{display:grid;grid-template-columns:1fr 1fr;gap:28px;border-top:1px solid var(--rule);margin-top:4px}
.ml{list-style:none;margin:0;padding:0}
.ml li{display:grid;grid-template-columns:minmax(0,1fr) auto;column-gap:12px;padding:8px 0;border-bottom:1px solid var(--rule);font-size:14px}
.ml li:last-child{border-bottom:0}
.mt{font-weight:600} .mv{font-family:var(--display);font-size:19px;text-align:right} .mv.dn{color:var(--critical)}
.mc{grid-column:1/-1;font-size:12.5px;color:var(--ink-soft)}
/* Fristen */
.fl,.hl{list-style:none;margin:0;padding:0}
.fl li{display:grid;grid-template-columns:96px minmax(0,1fr) auto;column-gap:12px;padding:9px 0;border-bottom:1px solid var(--rule);font-size:14.5px}
.fd{font-weight:600} .fb{text-align:right;white-space:nowrap}
.hl li{padding:8px 0;border-bottom:1px solid var(--rule);font-size:14px} .hl li:last-child{border-bottom:0}
.gaps{margin-top:28px;font-size:14px} .gaps summary{cursor:pointer;color:var(--ink-soft);text-decoration:underline}
.gaps ul{padding-left:18px} .gaps li{margin:6px 0}
.src{font-size:12px;color:var(--ink-soft);margin-top:20px;max-width:900px}
.foot{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;border-top:1px solid var(--rule);margin-top:28px;padding-top:14px;padding-bottom:28px;font-size:12.5px;color:var(--ink-soft)}
.gate{max-width:520px;margin:18vh auto;padding:0 24px;text-align:center;color:var(--ink-soft)}

@media (max-width:640px){ .wrap{padding:0 16px} .glance{grid-template-columns:1fr 1fr} .tile:nth-child(2n){border-right:0}

<script>
(async function(){
  const root = document.getElementById('app');
  function fail(m){ root.innerHTML = '<div class="gate"><p>PPotthoff · Montagsbrief</p><p>'+m+'</p></div>'; }
  const key = location.hash.slice(1);
  if(!key){ fail('Dieser Montagsbrief ist nur über den persönlichen Link lesbar.'); return; }
  try{
    const b64 = s => Uint8Array.from(atob(s.replace(/-/g,'+').replace(/_/g,'/')), c=>c.charCodeAt(0));
    const raw = b64(document.getElementById('payload').textContent.trim());
    const k = await crypto.subtle.importKey('raw', b64(key), 'AES-GCM', false, ['decrypt']);
    const plain = await crypto.subtle.decrypt({name:'AES-GCM', iv: raw.slice(0,12)}, k, raw.slice(12));
    const data = JSON.parse(new TextDecoder().decode(plain));
    root.innerHTML = data.html; document.title = data.title;
  }catch(e){ fail('Der Link ist unvollständig. Bitte den Link vollständig öffnen.'); }
})();
</script></body></html>
